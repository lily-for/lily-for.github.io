<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <!-- Style block allows the images to flow horizontally and then stack vertically on mobile -->
<style>
  .image-gallery {
    display: flex;
    gap: 20px; /* Space between the images */
    justify-content: center;
    flex-wrap: wrap; /* Allows images to stack on mobile */
    align-items: flex-start; /* Aligns the tops of the images nicely */
  }
  
  .image-gallery figure {
    width: 300px; /* Control image container width */
    margin: 0;
    text-align: center;
  }
  
  /* The first 3 images keep their original, perfect look */
  .image-gallery img {
    width: 100%;
    height: auto;
    border-radius: 8px;
  }

  /* SPECIAL WRAPPER: Only used for the 4th image to match the height */
  .image-gallery .crop-box {
    width: 300px;
    height: 225px; /* Adjust this number up or down if you want it slightly taller/shorter to match */
    overflow: hidden;
    border-radius: 8px;
  }

  /* Makes the 4th image fill the crop box */
  .image-gallery .crop-box img {
    height: 100%;
    object-fit: cover;
  }
</style>

    
    <title>Lily's Portfolio</title>
  </head>

  <body>
    <h1>Hi, I'm Lily</h1>
    <p>Welcome to my portfolio. I am building this website as I learn.</p>
