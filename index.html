<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <!-- Style block allows the images to flow horizontally and then stack vertically on mobile -->
  <style>
  .image-gallery {
    display: flex;
    gap: 20px; /* Space between the images */
    justify-content: center;
    flex-wrap: wrap; /* Allows images to stack on mobile */
  }
  
  .image-gallery figure {
    width: 300px; /* Control image container width */
    margin: 0;
    text-align: center;
  }

  /* --- NEW: This container locks the photo dimensions and crops excess --- */
  .image-gallery .img-container {
    width: 300px;
    height: 200px; /* Adjust this height if you want them taller/shorter */
    overflow: hidden;
    border-radius: 8px;
  }
  
  .image-gallery img {
    width: 100%;
    /* height: auto; -- REMOVED: replaced with height: 100% below */
    height: 100%; /* --- NEW: forces image to fill the container height --- */
    object-fit: cover; /* --- NEW: automatically crops the vertical photo to fit --- */
    /* border-radius: 8px; -- MOVED up to the .img-container so it crops nicely */
  }
</style>
    <title>Lily's Portfolio</title>
  </head>

  <body>
    <h1>Hi, I'm Lily</h1>
    <p>Welcome to my portfolio. I am building this website as I learn.</p>
  <!-- Drone -->

    Quadcopter Project</h2>

  <div class="image-gallery">
    <figure>
      <!-- --- NEW: Added the img-container wrapper div --- -->
      <div class="img-container">
        <img src="images/IMG_7852.jpeg" alt="Electronics and frame">
      </div>
      <figcaption>Getting the elctronics fit to the 3D printed frame.</figcaption>
    </figure>
    
    <figure>
      <!-- --- NEW: Added the img-container wrapper div --- -->
      <div class="img-container">
        <img src="images/IMG_7594.jpeg" alt="Soldering components">
      </div>
      <figcaption>Soldering components.</figcaption>
    </figure>

    <figure>
      <!-- --- NEW: Added the img-container wrapper div --- -->
      <div class="img-container">
        <img src="images/IMG_7731.jpeg" alt="Testing at home">
      </div>

    <figure>

</section>

</html>
